; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = 
	jgromes/RadioLib@^6.2.0
	mikalhart/TinyGPSPlus@^1.0.3
	bblanchon/ArduinoJson@^7.0.0
board_build.filesystem = littlefs
board_build.flash_size = 8MB
board_build.partitions = partitions_8MB_bigfs.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	-DCONFIG_FREERTOS_HZ=1000
	; FIRMWARE_VERSION is injected from the live git short-hash by
	; scripts/inject_version_post.py (into projenv only) so the collar's
	; telemetry `fw` field reflects the ACTUAL flashed commit. No longer a
	; frozen hand-edited string. main.cpp keeps an "unknown" #ifndef fallback.
	-DBUILD_TIMESTAMP=\"2026-05-31\"
	; ── RadioLib slimming ───────────────────────────────────────────────
	; Collar uses the SX1262 ONLY (see `SX1262 ... B2B` pin map in main.cpp),
	; plain LoRa packet mode. Skip compiling every other radio driver and
	; the digital-mode encoders we never use. Linker already strips unused
	; code from the .bin, so this changes clean-build COMPILE TIME, not
	; firmware size. Keep SX126X.
	;
	; IMPORTANT version caveat: the resolved RadioLib here is 6.6.0, which
	; (unlike the receiver's 7.x) has NO exclude macros for APRS / LoRaWAN /
	; BellModem / FSK4 / Pager — those always compile. AND in 6.6.0 the
	; non-excludable APRS depends on AX25, which depends on AFSK. So we must
	; NOT exclude AX25 or AFSK here — doing so makes APRS.h fail to compile
	; ('AX25Client does not name a type'). We therefore only exclude the
	; other RADIO DRIVERS and the cleanly-independent digital modes. A
	; future bump to RadioLib 7.x would let us exclude APRS/LoRaWAN too
	; (and match the receiver's fuller list) — that's a separate, API-
	; sensitive change because scanChannel()/LBT return codes shifted in 7.x.
	-D RADIOLIB_EXCLUDE_CC1101
	-D RADIOLIB_EXCLUDE_NRF24
	-D RADIOLIB_EXCLUDE_RF69
	-D RADIOLIB_EXCLUDE_SX1231
	-D RADIOLIB_EXCLUDE_SI443X
	-D RADIOLIB_EXCLUDE_RFM2X
	-D RADIOLIB_EXCLUDE_SX127X
	-D RADIOLIB_EXCLUDE_SX128X
	-D RADIOLIB_EXCLUDE_HELLSCHREIBER
	-D RADIOLIB_EXCLUDE_MORSE
	-D RADIOLIB_EXCLUDE_RTTY
	-D RADIOLIB_EXCLUDE_SSTV
	-D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
lib_ldf_mode = deep+

; V3.6.1 (transmitter): physically rename unused RadioLib .cpp files to
; .cpp.skip so PIO doesn't compile them. Belt-and-braces with the
; RADIOLIB_EXCLUDE_* flags above (which prevent symbol generation but
; don't prevent PIO from walking the source tree). See scripts/prune_radiolib.py.
extra_scripts =
	pre:scripts/prune_radiolib.py
	post:scripts/inject_version_post.py
