; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = 
	jgromes/RadioLib@^6.2.0 ; RadioLib module configuration - include ONLY SX126x and its dependencies
	mikalhart/TinyGPSPlus@^1.0.3 ; GPS library
	bblanchon/ArduinoJson@^7.0.0 ;
	https://github.com/tzapu/WiFiManager.git ; WiFiManager library
	adafruit/Adafruit SSD1306@^2.5.7 ;
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0 ; AsyncWebServer library for ESP32 S3 board with ESPHome platformio.ini
	ottowinter/ESPAsyncTCP-esphome@^1.2.2 ; ESPAsyncTCP library for ESP32 S3 board with ESPHome platformio.ini

; Flash & Filesystem Configuration
board_build.filesystem = littlefs
board_build.flash_size = 8MB
board_build.partitions = custom_8MB.csv

build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DASYNCWEBSERVER_REGEX
	; RadioLib module configuration - include ONLY SX126x and its dependencies
	; 12	Q
	; -DLED_BUILTIN=21  ; Define LED_BUILTIN for XIAO ESP32S3


