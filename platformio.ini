; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.flash_mode = dio ; dio is used for compatibility with PSRAM
lib_deps = 
	jgromes/RadioLib@^6.2.0
	mikalhart/TinyGPSPlus@^1.0.3
	bblanchon/ArduinoJson@^7.0.0
	https://github.com/tzapu/WiFiManager.git
	adafruit/Adafruit SSD1306@^2.5.7
	ottowinter/ESPAsyncWebServer-esphome@^3.0.0
	ottowinter/ESPAsyncTCP-esphome@^1.2.2
;	plerup/EspSoftwareSerial@^8.2.0
board_build.filesystem = littlefs
board_build.flash_size = 8MB
board_build.partitions = partitions_8MB_bigfs.csv ; 8MB flash with 6MB LittleFS and 1.5MB OTA
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DASYNCWEBSERVER_REGEX
