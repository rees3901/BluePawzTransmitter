; ═══════════════════════════════════════════════════════════
; PlatformIO Project Configuration — BluePawz Transmitter
; ═══════════════════════════════════════════════════════════
;
; This file tells PlatformIO how to build and upload the firmware.
; It specifies the target board, framework, libraries, and build settings.
;
; To build: Run "pio run" or click the build button in VS Code.
; To upload: Connect the Seeeduino XIAO ESP32S3 via USB and run "pio run -t upload".
; To monitor serial output: Run "pio device monitor" (115200 baud).
;
; PlatformIO docs: https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
; ── Target Hardware ──
platform = espressif32                          ; ESP32 platform (includes ESP32, ESP32-S2, ESP32-S3, etc.)
board = seeed_xiao_esp32s3                      ; Seeeduino XIAO ESP32S3 — tiny board with WiFi, BLE, and 8MB flash
framework = arduino                             ; Use the Arduino framework (setup/loop, digitalRead, Serial, etc.)

; ── Flash Configuration ──
board_build.flash_mode = dio                    ; Dual I/O flash mode (compatible with most ESP32-S3 boards)
board_build.flash_size = 8MB                    ; This board has 8MB of flash memory (more than the typical 4MB)
board_build.partitions = partitions_8MB_bigfs.csv ; Custom partition table that allocates space for app + filesystem

; ── Build Flags ──
build_flags =
	-DBOARD_HAS_PSRAM                             ; Tell the framework that this board has PSRAM (extra RAM chip)
	-mfix-esp32-psram-cache-issue                  ; Compiler fix for a known ESP32 PSRAM cache bug

; ── Serial Monitor ──
monitor_speed = 115200                          ; Baud rate for the serial monitor (must match Serial.begin() in code)

; ── Filesystem ──
board_build.filesystem = littlefs               ; Use LittleFS for on-flash filesystem (alternative to SPIFFS)

; ── Library Dependencies ──
; PlatformIO auto-downloads these from the registry when you build.
lib_deps =
	jgromes/RadioLib@^7.1.2                        ; LoRa radio library — drives the SX1262 module (TX/RX/config)
	mikalhart/TinyGPSPlus@^1.1.0                   ; GPS NMEA parser — converts raw GPS serial data to lat/lon/speed/time
